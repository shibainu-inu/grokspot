<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<title>GrokSpot</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1c1c1c;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  :root {
    /*
     * 顔（胴体）の直径。画面は直径 480px の円。まわりに虹色の軌跡や紙吹雪が
     * 出る余白を残すため小さめにしている（軌跡は顔の直径の約 0.7 倍まで外へ広がる）。
     */
    --body: 300px;
  }
  /* 胴体は x.ai と同じ比率（bodyScale 228.541/210）で、canvas の 228.541/259 = 88.2% の直径。 */
  #stage {
    position: relative;
    flex: none;
    width: calc(var(--body) / 0.88239);
    height: calc(var(--body) / 0.88239);
  }
  #face {
    width: 100%;
    height: 100%;
    display: block;
    will-change: transform;
  }
  /*
   * 球体の陰影。ライブラリは胴体を単色でしか塗れないので、白い胴体の上に
   * 同じ大きさの円を乗算で重ねる。黒い目は乗算しても黒のまま残る。
   * 色は grokbot_color.png の実測値（ハイライト #fefefe → 中ほど #dedede → 縁 #bbbbbb）。
   * 縁に白い線が出ないよう、胴体より 2px 大きくしている。
   */
  #shade {
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(var(--body) + 2px);
    height: calc(var(--body) + 2px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 58% 44%, #fefefe 0%, #f4f4f4 14%, #dedede 48%, #bbbbbb 100%);
    mix-blend-mode: multiply;
    pointer-events: none;
    will-change: transform;
  }
  #label {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 34px;
    text-align: center;
    font: 600 16px/1 system-ui, sans-serif;
    color: #9aa3b5;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #label.show { opacity: 1; }
  /*
   * 音声入力の目印（voice.js）。画面の縁に沿った光の輪と、下の一言。
   * waiting: 話しかけられるのを待っている（ゆっくり明滅）
   * hearing: ユーザーの声を聞いている（明るく点灯）
   * 明滅は opacity だけを動かす（GPU で合成される）。
   */
  #mic-ring {
    position: fixed;
    inset: 4px;
    border-radius: 50%;
    border: 5px solid #4cc2ff;
    box-shadow: 0 0 18px 2px rgba(76, 194, 255, 0.55), inset 0 0 18px 2px rgba(76, 194, 255, 0.35);
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
    will-change: opacity;
  }
  #mic-hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 30px;
    text-align: center;
    font: 600 17px/1 system-ui, sans-serif;
    color: #8fd6ff;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  body[data-mic="waiting"] #mic-ring { animation: mic-breathe 2.4s ease-in-out infinite; }
  body[data-mic="hearing"] #mic-ring { opacity: 1; }
  body[data-mic="waiting"] #mic-hint,
  body[data-mic="hearing"] #mic-hint { opacity: 1; }
  /* 待機の目印と重ならないよう、ツアーの名札は隠す。 */
  body[data-mic] #label { display: none; }
  /*
   * MCP の一言（external.js）。マイクの案内文と同じ場所・同じ文字で、絵文字か短い単語だけを出す。
   * 状態が変わると消える。
   */
  #caption {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 30px;
    text-align: center;
    font: 600 17px/1 system-ui, sans-serif;
    color: #8fd6ff;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  #caption.show { opacity: 1; }
  /* 絵文字は少しだけ大きく、同じ下端にそろえる。 */
  #caption.emoji { font-size: 24px; bottom: 26px; }
  /*
   * 未読のしるし（external.js）。notifying / alerting のあと、画面に触れるか idle が来るまで残す。
   * 一言やマイクの案内文と同じ場所なので、それらが出ている間は隠す。
   */
  #unread {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 26px;
    text-align: center;
    font: 24px/1 system-ui, sans-serif;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  body.unread #unread { opacity: 1; animation: unread-breathe 3s ease-in-out infinite; }
  body.unread.captioned #unread,
  body.unread[data-mic] #unread { opacity: 0; animation: none; }
  @keyframes unread-breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  /*
   * MCP で顔が変わったときの光（external.js）。マイクの輪と同じ見た目で、一度だけ光って消える
   * （光り続けるのは「話しかけてよい」の印なので、こちらは光り続けない）。
   */
  #mcp-ring {
    position: fixed;
    inset: 4px;
    border-radius: 50%;
    border: 5px solid #4cc2ff;
    box-shadow: 0 0 18px 2px rgba(76, 194, 255, 0.55), inset 0 0 18px 2px rgba(76, 194, 255, 0.35);
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }
  #mcp-ring.flash { animation: mcp-flash 1.8s ease-out; }
  @keyframes mcp-flash {
    0% { opacity: 0; }
    15% { opacity: 1; }
    55% { opacity: 0.8; }
    100% { opacity: 0; }
  }
  /* 一言が出ている間は、同じ場所のマイクの案内文を隠す（青い輪は残す）。 */
  body.captioned #mic-hint { opacity: 0 !important; }
  /*
   * OAuth のペアリングコード（pairing.js）。顔を暗くして、中央に 6 桁を大きく出す。
   */
  #pairing {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(18, 18, 18, 0.86);
    color: #eee;
    font: 500 16px/1.4 system-ui, sans-serif;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #pairing.show { opacity: 1; }
  #pairing .pair-title { color: #8fd6ff; font-weight: 600; }
  #pairing .pair-client { color: #fff; font-weight: 600; max-width: 300px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pairing .pair-code { font: 700 64px/1 system-ui, sans-serif; letter-spacing: 6px; margin: 18px 0 14px; color: #fff; }
  #pairing .pair-hint { color: #aaa; font-size: 15px; max-width: 300px; }
  /* 明るい背景（白い Echo Spot 向け、index.html の background=）。文字を濃い青にする。 */
  /* 陰影を胴体より大きくすると明るい背景に灰色の縁が出るので、同じ大きさにする（白い縁は見えない）。 */
  body.light #shade { width: var(--body); height: var(--body); }
  body.light #label { color: #5b6476; }
  body.light #mic-hint,
  body.light #caption { color: #1b88cc; }
  @keyframes mic-breathe {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.8; }
  }
  /*
   * 変形用の部品（「・・・」の両脇の点、「！」の棒）。毎フレーム描き直さないよう、
   * 一度描いた絵を transform と opacity だけで動かす（GPU で合成される）。
   */
  .side-dot {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 58% 44%, #fefefe 0%, #f4f4f4 14%, #dedede 48%, #bbbbbb 100%);
    pointer-events: none;
    will-change: transform, opacity;
  }
  #bang-bar {
    position: absolute;
    inset: 0;
    transform-origin: 0 0;
    pointer-events: none;
    will-change: transform, opacity;
  }
  /* 虹色の軌跡と紙吹雪（fx.js）。頭の後ろ側と手前側の 2 枚。 */
  .fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #bang-bar svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
</style>
</head>
<body>
<canvas id="fx-back" class="fx"></canvas>
<div id="stage">
  <canvas id="face"></canvas>
  <div id="shade"></div>
  <div class="side-dot" hidden></div>
  <div class="side-dot" hidden></div>
  <div class="side-dot" hidden></div>
  <div class="side-dot" hidden></div>
  <!-- canvas と同じ座標系（viewBox -15 -15 259 259）で描いた「！」の棒。 -->
  <div id="bang-bar" hidden>
    <svg viewBox="-15 -15 259 259" aria-hidden="true">
      <defs>
        <!-- #shade と同じ陰影（circle at 58% 44% → 最遠の角まで）。 -->
        <radialGradient id="ball" cx="0.58" cy="0.44" r="0.806">
          <stop offset="0" stop-color="#fefefe"/>
          <stop offset="0.14" stop-color="#f4f4f4"/>
          <stop offset="0.48" stop-color="#dedede"/>
          <stop offset="1" stop-color="#bbbbbb"/>
        </radialGradient>
      </defs>
      <path fill="url(#ball)"
        d="M99.2705 81.2705A15 15 0 0 1 129.2705 81.2705L122.7705 153.7705A8.5 8.5 0 0 1 105.7705 153.7705Z"/>
    </svg>
  </div>
</div>
<canvas id="fx-front" class="fx"></canvas>
<div id="label"></div>
<div id="mic-ring"></div>
<div id="mic-hint"></div>
<div id="mcp-ring"></div>
<div id="caption" aria-live="polite"></div>
<div id="unread" aria-live="polite"></div>
<div id="pairing" aria-live="polite">
  <div class="pair-title"></div>
  <div class="pair-client"></div>
  <div class="pair-code"></div>
  <div class="pair-hint"></div>
</div>
<script src="i18n.js"></script>
<script src="grokbot.js"></script>
<script src="fx.js"></script>
<script src="motion.js"></script>
<script src="life.js"></script>
<script src="actions.js"></script>
<script src="voice.js"></script>
<script src="external.js"></script>
<script src="pairing.js"></script>
<script src="touch.js"></script>
<script>
(function () {
  var lib = window.GrokBotLib;

  // x.ai の「Avatar motion system」と同じ巡回（表示名・状態・表示時間）。
  var TOUR = [
    { label: 'Idle', state: 'idle', ms: 4200 },
    { label: 'Working', state: 'working', ms: 4600 },
    { label: 'Waiting', state: 'bored', ms: 4200 },
    { label: 'Blocked', state: 'alerting', ms: 4200 },
    { label: 'Thinking', state: 'thinking', ms: 4600 },
    { label: 'Done', state: 'celebrate', ms: 4200 }
  ];

  // Colours from files/face_color (?body= / ?eye= / ?background=, rrggbb), e.g. a pink face
  // with white eyes on white for a white Echo Spot. The body is painted in its colour and
  // #shade multiplies the same grey shading over it; parts drawn without #shade (side dots,
  // the "!" bar, morph parts) get the grey stops multiplied by it here.
  function param(name) { return (new RegExp('[?&]' + name + '=([0-9a-fA-F]{6})').exec(location.search) || [])[1]; }
  var tint = param('body');
  var eye = param('eye');
  var background = param('background');
  if (background) {
    document.documentElement.style.background = document.body.style.background = '#' + background;
    var rgb = [0, 2, 4].map(function (i) { return parseInt(background.substr(i, 2), 16); });
    // Light backgrounds get darker text (the hints are pale blue for a dark screen).
    if (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2] > 160) document.body.classList.add('light');
  }
  function tinted(grey) {
    if (!tint) return grey;
    var out = '#';
    for (var i = 0; i < 3; i += 1) {
      var g = parseInt(grey.substr(1 + i * 2, 2), 16);
      var t = parseInt(tint.substr(i * 2, 2), 16);
      out += ('0' + Math.round(g * t / 255).toString(16)).slice(-2);
    }
    return out;
  }
  if (tint) {
    var stops = ['#fefefe', '#f4f4f4', '#dedede', '#bbbbbb'].map(tinted);
    var ball = 'radial-gradient(circle at 58% 44%, ' + stops[0] + ' 0%, ' + stops[1] + ' 14%, ' +
      stops[2] + ' 48%, ' + stops[3] + ' 100%)';
    document.querySelectorAll('.side-dot').forEach(function (dot) { dot.style.background = ball; });
    document.querySelectorAll('#ball stop').forEach(function (stop, i) { stop.setAttribute('stop-color', stops[i]); });
  }

  var bot = new lib.GrokBot(document.getElementById('face'), {
    state: 'idle',
    shape: 'blob',
    // grokbot_color.png に合わせた色。胴体は白で描き、陰影は #shade で付ける。
    theme: { bodyColor: tint ? '#' + tint : '#ffffff', eyeColor: eye ? '#' + eye : '#0c0c0c', badgeColor: '#ffffff' },
    // 状態ごとの表情プールを自動で巡回させる（既定は false で、表情が固定される）。
    autoExpression: true,
    // まばたきは motion.js がまぶた（eyeOpen）で行う。
    autoBlink: false,
    // 専用端末なので、端末の「アニメーションを減らす」設定があっても動かし続ける。
    respectReducedMotion: false,
    // 描画のタイミングは motion.js が決める（毎秒 30 フレーム、体の動きと同じフレームで目を描く）。
    manualFrames: true,
    // ここから下は x.ai の Grok Bot アバターの描き方に合わせる設定（デモ画像との実測比較で確認）。
    // 胴体と目の比率（x.ai の胴体は 228.541、元の Flutter 版は 210）。
    bodyScale: 228.541 / 210,
    // まぶたは目の長い方向に閉じる（横線の目は半目で短くなる）。
    lidAxis: 'major',
    // 大きな目どうしが近づきすぎたら縮めて 5 単位のすき間を保つ。
    minEyeGap: 5
  });

  var fx = new window.GrokSpotEffects(document.getElementById('fx-back'), document.getElementById('fx-front'));
  fx.partColor = tinted('#dedede');

  // 体の揺れ・まぶた・視線・回転（x.ai の Avatar motion system を再現）。
  var motion = new window.GrokSpotMotion(bot, {
    face: document.getElementById('face'),
    shade: document.getElementById('shade'),
    sideDots: document.querySelectorAll('.side-dot'),
    bangBar: document.getElementById('bang-bar'),
    fx: fx,
    frameRate: 30,
    blinkCadence: function (state) { return lib.stateData[state].blinkCadence; }
  });

  var label = document.getElementById('label');
  var labelTimer = null;
  function flashLabel(text) {
    label.textContent = text;
    label.classList.add('show');
    clearTimeout(labelTimer);
    labelTimer = setTimeout(function () { label.classList.remove('show'); }, 1500);
  }

  // 巡回（ツアー）。DevTools から startTour() で始め、タップで次へ進む。外から setBotState を呼ぶと止まる。
  var tourIndex = -1;
  var tourTimer = null;
  function tourStep(index) {
    tourIndex = index % TOUR.length;
    var step = TOUR[tourIndex];
    motion.setState(step.state);
    flashLabel(step.label);
    clearTimeout(tourTimer);
    tourTimer = setTimeout(function () { tourStep(tourIndex + 1); }, step.ms);
  }

  window.startTour = function () {
    window.grokspotLife.stop();
    tourStep(0);
  };
  window.stopTour = function () {
    clearTimeout(tourTimer);
    tourTimer = null;
  };

  window.setBotState = function (name) {
    if (!Object.prototype.hasOwnProperty.call(lib.stateData, name)) {
      console.warn('setBotState: unknown state ' + name);
      return false;
    }
    window.stopTour();
    window.grokspotLife.stop();
    motion.setState(name);
    return true;
  };

  window.isBotState = function (name) {
    return Object.prototype.hasOwnProperty.call(lib.stateData, name);
  };

  window.getBotState = function () {
    return bot.options.state;
  };

  // 画面に触れたときの反応は touch.js。巡回中のタップだけはここで次へ進める。
  // 巡回は DevTools から startTour() で見られる。
  window.tourActive = function () { return !!tourTimer; };
  window.nextTourStep = function () { tourStep(tourIndex + 1); };

  window.bot = bot;
  window.motion = motion;

  window.grokspot.act('idle');
})();
</script>
</body>
</html>
